      {

        "@id": "https://hirestarship.com/#organization",
        "name": "Starship Studios",
        "alternateName": ["Starship Consulting", "Hire Starship"],
        "url": "https://hirestarship.com/",
        "logo": { "@type": "ImageObject", "url": "https://hirestarship.com/assets/icon-512.png", "width": 512, "height": 512 },
        "image": "https://hirestarship.com/og-image.png",
        "description": "Small software studio in Washington, DC building mobile apps, web apps, product design, and AI integrations. Independent since 2005.",
        "email": "hello@hirestarship.com",
        "foundingDate": "2005",
        "founder": { "@type": "Person", "name": "Danny Ricciotti", "sameAs": "https://www.linkedin.com/in/dannyricciotti/" },
        "address": { "@type": "PostalAddress", "addressLocality": "Washington", "addressRegion": "DC", "addressCountry": "US" },

        "sameAs": ["https://www.linkedin.com/in/dannyricciotti/"],
        "contactPoint": [
          { "@type": "ContactPoint", "email": "hello@hirestarship.com", "contactType": "sales", "availableLanguage": ["English"] }

        "knowsAbout": ["React Native", "Expo", "Swift", "SwiftUI", "iOS", "Android", "React", "TypeScript", "Next.js", "AI integration", "Claude", "Agentic workflows", "Product design"],

          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Product design", "description": "Flows, screens, brand systems. Product design that ships alongside the engineering." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI integration", "description": "Agentic workflows and AI integrations — Claude and the SDKs around it, wired into existing products." } }
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://hirestarship.com/#website",
        "url": "https://hirestarship.com/",
        "name": "Starship Studios",
        "inLanguage": "en-US",

        "@id": "https://hirestarship.com/#webpage",
        "url": "https://hirestarship.com/",
        "name": "Starship Studios — Mobile, Web & AI Development Studio",
        "description": "Washington, DC software studio building iOS and Android apps, web apps, and AI integrations. Email hello@hirestarship.com.",

        "primaryImageOfPage": { "@type": "ImageObject", "url": "https://hirestarship.com/og-image.png", "width": 1200, "height": 630 }
